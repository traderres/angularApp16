<div class="m-2.5">

  <div class="grid grid-cols-2">
    <div>
      <span class="text-xl">Responsive Dashboard Page</span>
    </div>

    <div class="flex place-content-end">
      Help
    </div>
  </div>

  <div class="mt-2.5">
    <!-- Add Grid Here -->
    <div class="overflow-y-auto" style="height: calc(100vh - 150px)">
      <div class="flex flex-row flex-wrap gap-x-5 gap-y-5 m-2.5">

        <div class="w-[400px] h-[200px] mat-elevation-z4 p-2.5 cursor-pointer" (click)="this.navigateToPieChartPage()">
            <!-- C H A R T     1  -->
            <app-pie-chart-small class="h-full w-full"></app-pie-chart-small>
        </div>

        <div class="w-[400px] h-[200px] mat-elevation-z4 p-2.5">
            <!-- C H A R T     2  -->
            <app-line-chart-small class="h-full w-full"></app-line-chart-small>
        </div>

        <div class="w-[400px] h-[200px] mat-elevation-z4 p-2.5 cursor-pointer" (click)="this.navigateToColumnChartPage()">
          <!-- C H A R T     3  -->
          <app-column-chart-small class="h-full w-full"></app-column-chart-small>
        </div>


        <div class="w-[400px] h-[200px] mat-elevation-z4 p-2.5 cursor-pointer" (click)="this.navigateToZommableTimeSeriesLineChartPage()">
          <!-- C H A R T     4  -->
          <app-zommable-time-series-line-chart-small class="h-full w-full"></app-zommable-time-series-line-chart-small>
        </div>

        <div class="w-[400px] h-[200px] mat-elevation-z4 p-2.5 cursor-pointer"  (click)="this.navigateToUsaMapPage()">
            <!-- M A P      O F    U S A   -->
            <app-usa-map-small class="h-full w-full"></app-usa-map-small>
        </div>

        <div class="w-[400px] h-[200px] mat-elevation-z4 p-2.5 cursor-pointer"  (click)="this.navigateToGaugePage()">
          <!-- C H A R T    6  -->
          <app-gauge-small class="h-full w-full"></app-gauge-small>
        </div>
      </div>
    </div>

    </div>

  </div>
